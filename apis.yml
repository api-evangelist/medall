aid: medall
name: MedAll
description: >-
  MedAll is a UK-founded healthcare education platform on a mission to make medical education
  radically accessible. It hosts live and on-demand courses, conferences, workshops, webinars and
  training sessions for healthcare professionals, students and organisations, and provides event
  management tooling for registrations, feedback forms, certificates, abstracts, schedules and
  digital poster halls, alongside CME (continuing medical education), question banks and mobile apps
  for iOS and Android. The platform is used by clinicians and institutions worldwide. As of this
  enrichment pass MedAll publishes no public API, developer portal, SDKs or webhooks; this profile
  captures its public identity and domain-security posture. Backed by Seedcamp.
